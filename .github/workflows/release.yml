name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the tested unsigned Windows installer to Releases'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: installer-release
  cancel-in-progress: false

jobs:
  ui-layout-check:
    name: Browser Layout (Themes & Locales)
    uses: ./.github/workflows/browser-layout.yml

  verify-installer:
    needs: [ui-layout-check]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAURI_TARGET_TRIPLE: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Check source
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          bun run check:versions
          bun run typecheck
          bun run typecheck:ui
          bun run check:repository
          bun run lint
          # Windows Git/PowerShell integration tests exceeded their existing
          # deadlines under default parallelism; bound contention, keep timeouts.
          bun run test -- --maxWorkers=2
          bun run test:packages
      - name: Prepare runtime tools
        run: bun scripts/prepare-release-sidecars.mjs --target x86_64-pc-windows-msvc
      - run: bun scripts/setup-sidecars.mjs --target x86_64-pc-windows-msvc
      - name: Check Rust
        working-directory: src-tauri
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Install license and signature verifiers
        run: pwsh -NoProfile -File scripts/install-release-tools.ps1
      - name: Collect licenses
        run: bun scripts/prepare-release-licenses.mjs
      - name: Build synthetic upgrade baseline
        run: pwsh -NoProfile -File scripts/build-upgrade-baseline.ps1
      - name: Build final installer
        shell: pwsh
        run: |
          ./scripts/build-release-installer.ps1
      - name: Verify fresh install and native download
        shell: pwsh
        run: |
          & ./scripts/verify-windows-msi-install.ps1 -VerifyLicenses -RunNativeSmoke
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/ytdl-flow-install-trust/result.json" -Destination "$env:RUNNER_TEMP/ytdl-flow-install-trust/fresh-install.json"
      - name: Verify synthetic upgrade and native download
        shell: pwsh
        run: |
          & ./scripts/verify-windows-msi-install.ps1 -VerifyLicenses -RunNativeSmoke -PreviousMsi "$env:RUNNER_TEMP/ytdl-upgrade-baseline.msi" -BaselineKind synthetic
      - name: Record unsigned installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi -Filter '*.msi' -File)
          if ($files.Count -ne 1) { throw 'Expected exactly one final installer' }
          if ((Get-AuthenticodeSignature -LiteralPath $files[0].FullName).Status -ne 'NotSigned') { throw 'Expected unsigned manual installer' }
          @{ status='unsigned'; msiSha256=(Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant(); updaterVerified=$false; authenticodeVerified=$false } | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/ytdl-flow-install-trust/signature.json"
      - name: Prepare verified release files
        if: github.ref_type == 'tag' || inputs.publish_release == true
        run: bun scripts/prepare-verified-release.mjs
      - name: Publish installer release
        if: success() && (github.ref_type == 'tag' || inputs.publish_release == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/publish-installer-release.mjs
      - name: Upload validation installer
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_release != true
        uses: actions/upload-artifact@v4
        with:
          name: validation-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
      - name: Upload acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-reports
          path: |
            ${{ runner.temp }}/ytdl-flow-install-trust/*.json
            ${{ runner.temp }}/ytdl-flow-install-trust/*.log
          if-no-files-found: warn
